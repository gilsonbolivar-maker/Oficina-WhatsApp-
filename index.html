<style>
  :root{
    /* paleta lilás — névoa, pastel, puro, lavanda profundo, ameixa escuro */
    --nevoa:#F3E8FF; --pastel:#D8B4FE; --lilas:#C084FC; --lavanda:#9333EA; --ameixa:#581C87;
    --bg:#191024; --fg:var(--nevoa); --dim:#A98FCB; --line:#4A2E68; --accent:var(--lavanda);
    /* superfícies: elevada, base e afundada */
    --sup-alta:#30203F; --sup:#261935; --sup-baixa:#1E1429; --fundo-sombra:#0B0714;
    --relevo:
      0 3px 0 var(--fundo-sombra),
      0 6px 14px -6px rgba(8,4,16,.8),
      inset 0 1px 0 rgba(243,232,255,.16);
    --relevo-alto:
      0 5px 0 var(--fundo-sombra),
      0 16px 30px -12px rgba(8,4,16,.9),
      inset 0 1px 0 rgba(243,232,255,.18);
    --afundado:
      inset 0 3px 6px rgba(8,4,16,.75),
      inset 0 -1px 0 rgba(243,232,255,.06);
    --grad-relevo:linear-gradient(180deg,var(--sup-alta),var(--sup-baixa));
    --grad-marca:linear-gradient(180deg,#A855F7,#8B2FE0);
    --brilho:radial-gradient(120% 80% at 50% -10%, rgba(112,45,190,.55), transparent 70%);
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
  body{font-family:var(--mono);font-size:15px;line-height:1.45;
       padding:16px 16px calc(16px + env(safe-area-inset-bottom));
       max-width:760px;margin:0 auto;-webkit-text-size-adjust:100%;
       background-image:var(--brilho);background-repeat:no-repeat;background-attachment:fixed}
  ::selection{background:var(--lavanda);color:#fff}
  .rotulo{
    color:var(--lilas);font-size:11px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;
    margin:0 0 5px;text-align:center;
  }
  textarea{
    width:100%;min-height:170px;resize:vertical;
    background:var(--sup-baixa);color:var(--fg);border:1px solid var(--line);border-radius:16px;
    padding:14px;font-family:var(--mono);font-size:15px;line-height:1.55;caret-color:var(--lilas);
    box-shadow:var(--afundado);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  textarea:hover{border-color:#5E3A85}
  textarea:focus{
    outline:none;border-color:var(--lavanda);
    box-shadow:var(--afundado), 0 0 0 3px rgba(147,51,234,.30);
  }

  /* hidden precisa vencer o display das classes abaixo */
  [hidden]{display:none !important}

  /* ---- faixas: um assunto por linha ---- */
  .faixa{margin-top:16px}
  /* sulco: linha escura com um fio de luz embaixo, como um vinco na superfície */
  .faixa.sep{position:relative;margin-top:22px;padding-top:20px}
  .faixa.sep::before{
    content:"";position:absolute;left:0;right:0;top:0;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,#08040E 12%,#08040E 88%,transparent);
    box-shadow:0 1px 0 rgba(216,180,254,.16);
  }
  .faixa .rotulo{margin-bottom:6px;text-align:center}
  .linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
  .linha + .linha{margin-top:8px}

  .topo-tema{margin:12px 0 4px}
  .temas{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(66px,1fr));
    gap:8px;margin:0 0 14px;
  }
  .tema{
    display:flex;flex-direction:column;align-items:center;gap:5px;
    padding:7px 4px;border-radius:11px;cursor:pointer;
    font-family:var(--mono);font-size:10.5px;color:var(--dim);
    background-image:var(--grad-relevo);
    border:1px solid var(--line);
    box-shadow:var(--relevo);
  }
  .tema:active{transform:translateY(3px);box-shadow:var(--afundado)}
  .tema[aria-pressed="true"]{color:var(--fg);border-color:var(--lilas);box-shadow:var(--relevo)}
  .tema .amostra{
    width:100%;height:26px;border-radius:7px;border:1px solid #00000055;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
  }

  .opcional{margin-top:10px}
  .link{
    background:none;border:0;padding:4px 6px;cursor:pointer;
    font-family:var(--mono);font-size:12px;color:var(--dim);
  }
  .link:hover{color:var(--fg)}
  .link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  /* ---- botões com relevo ---- */
  .bt3d{
    flex:0 0 auto;min-width:0;
    font-family:var(--mono);font-size:13px;font-weight:700;color:var(--fg);
    padding:10px 16px;border-radius:11px;cursor:pointer;
    background-image:var(--grad-relevo);
    border:1px solid var(--line);
    box-shadow:var(--relevo);
    transition:filter .12s ease, box-shadow .09s ease, transform .09s ease;
  }
  .bt3d:hover:not(:disabled){filter:brightness(1.12)}
  .bt3d:active:not(:disabled){
    transform:translateY(3px);
    box-shadow:var(--afundado);
  }
  .bt3d:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .bt3d:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .bt3d.largo{flex:1 1 96px;text-align:center}
  .bt3d.primary{
    color:#fff;border-color:#7E22CE;
    background-image:var(--grad-marca);
    box-shadow:var(--relevo-alto);
  }
  .bt3d.primary:active:not(:disabled){box-shadow:var(--afundado)}
  .bt3d.suave,
  .bt3d.apagar{color:var(--dim);font-weight:400}
  .bt3d.apagar:hover{color:#ff7a6b}
  .bt3d.apagar[data-armed="1"]{color:#ff7a6b;font-weight:700}
  .bt3d.emoji{padding:6px 9px;font-size:19px;font-weight:400;line-height:1.15}
  .bt3d.mais{color:var(--dim);font-size:12px}
  .bt3d.mais[aria-expanded="true"]{color:var(--lilas);border-color:#C084FC66}

  /* ---- barra de emojis ---- */
  .emojis{
    display:flex;gap:6px;flex:1 1 0;min-width:0;padding:3px 0 5px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .emojis::-webkit-scrollbar{display:none}

  /* ---- seletores segmentados, com o mesmo relevo ---- */
  .seg{
    display:flex;flex:0 0 auto;border-radius:11px;overflow:hidden;
    border:1px solid var(--line);background-image:var(--grad-relevo);
    box-shadow:var(--relevo);
  }
  .seg label{position:relative;cursor:pointer}
  .seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
  .seg span{display:block;padding:10px 14px;font-size:13px;color:var(--dim);transition:color .15s ease}
  .seg input:checked ~ span{background:var(--pastel);color:#2A0D45;font-weight:700}
  .seg input:focus-visible ~ span{outline:2px solid var(--accent);outline-offset:-2px}

  .mini{
    width:42px;height:42px;object-fit:cover;border-radius:10px;
    border:1px solid var(--line);box-shadow:var(--relevo);
  }

  /* ---- painel de emojis ---- */
  .painel{
    margin-top:8px;border:1px solid var(--line);border-radius:14px;
    background:var(--sup-baixa);box-shadow:var(--afundado);overflow:hidden;
  }
  .abas{
    display:flex;gap:4px;padding:8px;overflow-x:auto;
    border-bottom:1px solid var(--line);scrollbar-width:none;
  }
  .abas::-webkit-scrollbar{display:none}
  .abas button{
    flex:0 0 auto;min-width:0;padding:6px 11px;border-radius:8px;cursor:pointer;
    font-family:var(--mono);font-size:12px;color:var(--dim);
    background:transparent;border:1px solid transparent;
  }
  .abas button[aria-selected="true"]{color:#2A0D45;background:var(--lilas);font-weight:700}
  .grade{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));
    gap:4px;padding:8px;max-height:210px;overflow-y:auto;
  }
  .grade button{
    padding:6px 0;font-size:21px;line-height:1.1;cursor:pointer;
    background:transparent;border:1px solid transparent;border-radius:8px;
  }
  .grade button:hover{background:var(--sup-alta);border-color:var(--line)}

  #preview{
    margin-top:16px;padding:6px;border:1px solid var(--line);border-radius:18px;
    background-image:var(--grad-relevo);box-shadow:var(--relevo-alto);
    overflow:hidden;display:none;
  }
  #preview img{border-radius:12px}
  #preview img{display:block;width:100%;height:auto}
  .meta{color:var(--dim);font-size:12px;margin-top:10px;min-height:16px;text-align:center}
  .hint{color:var(--dim);font-size:12px;margin-top:14px;border-top:1px solid var(--line);padding-top:10px;text-align:center}
  .hint b{color:var(--fg)}
  .versao{display:inline-block;margin-top:6px;font-size:11px;color:#6B5486;letter-spacing:.08em}
</style>
</head>

<script>
(function () {
  "use strict";

  var W = 1080;              // largura final da imagem (px)
  var PAD = 64;              // margem interna
  var LH = 1.5;              // altura de linha
  var MAXH = 4200;           // altura máxima antes de reduzir a fonte
  var FONT = '"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace';

  var $ = function (id) { return document.getElementById(id); };
  var msg = $("msg"), out = $("out"), preview = $("preview"), meta = $("meta");
  var btnGen = $("gen"), btnShare = $("share"), btnSave = $("save"), btnCopy = $("copy");
  var btnWipe = $("wipe");

  var current = null;

  /* paletas da imagem gerada: preto no branco e papel ficam em escala de cinza,
     por isso continuam saindo no PNG leve */
  var TEMAS = [
    { id: "terminal", nome: "Terminal", fundo: "#000000", texto: "#ffffff" },
    { id: "papel",    nome: "Papel",    fundo: "#ffffff", texto: "#111111" },
    { id: "lilas",    nome: "Lilás",    fundo: "#581C87", texto: "#F3E8FF" },
    { id: "amarelo",  nome: "Amarelo",  fundo: "#120e00", texto: "#ffd700" },
    { id: "noturno",  nome: "Noturno",  fundo: "#0a1628", texto: "#cfe4ff" }
  ];
  var tema = TEMAS[0];
  var foto = null;          // { fonte, larg, alt, url } da foto anexada, quando houver   // { blob, url, name }

  /* ---------- rascunho ---------- */
  try { msg.value = localStorage.getItem("draft") || ""; } catch (e) {}
  msg.addEventListener("input", function () {
    disarm();
    try { localStorage.setItem("draft", msg.value); } catch (e) {}
  });

  /* ---------- apagar tudo (texto salvo + imagem gerada) ---------- */
  var armed = false, armTimer;
  function disarm() {
    armed = false;
    clearTimeout(armTimer);
    btnWipe.textContent = "Apagar tudo";
    btnWipe.removeAttribute("data-armed");
  }
  function wipe() {
    disarm();
    msg.value = "";
    try { localStorage.removeItem("draft"); } catch (e) {}
    if (current) { URL.revokeObjectURL(current.url); current = null; }
    if (foto) btnTirar.click();
    out.removeAttribute("src");
    preview.style.display = "none";
    btnShare.disabled = btnSave.disabled = btnCopy.disabled = true;
    meta.textContent = "apagado — nada guardado neste aparelho";
    msg.focus();
  }
  btnWipe.addEventListener("click", function () {
    if (!msg.value && !current) { wipe(); return; }
    if (!armed) {
      armed = true;
      btnWipe.textContent = "Apagar mesmo?";
      btnWipe.setAttribute("data-armed", "1");
      armTimer = setTimeout(disarm, 4000);
      return;
    }
    wipe();
  });

  /* ---------- quebra de linha (monoespaçada) ---------- */
  function wrap(text, maxChars) {
    var lines = [];
    text.replace(/\r/g, "").split("\n").forEach(function (para) {
      if (!para.length) { lines.push(""); return; }
      var line = "";
      para.split(/(\s+)/).forEach(function (tk) {
        if (!tk.length) return;
        if (/^\s+$/.test(tk)) {                    // espaços
          if (line.length && line.length + tk.length <= maxChars) line += tk;
          else if (line.length) { lines.push(line); line = ""; }
          return;
        }
        while (tk.length) {                        // palavras
          var free = maxChars - line.length;
          if (tk.length <= free) { line += tk; tk = ""; }
          else if (tk.length <= maxChars) { lines.push(line.replace(/\s+$/, "")); line = ""; }
          else { line += tk.slice(0, free); tk = tk.slice(free); lines.push(line); line = ""; }
        }
      });
      lines.push(line.replace(/\s+$/, ""));
    });
    return lines;
  }

  /* ---------- desenho ---------- */
  function draw(text, fontSize) {
    var c = document.createElement("canvas");
    var g = c.getContext("2d");
    g.font = fontSize + "px " + FONT;
    var charW = g.measureText("M").width || fontSize * 0.6;
    var maxChars = Math.max(8, Math.floor((W - PAD * 2) / charW));

    var lines = wrap(text, maxChars);
    var lineH = Math.round(fontSize * LH);
    var alturaTexto = PAD * 2 + lines.length * lineH;
    var H;

    if (foto) {
      // a foto define a altura; se o texto for maior, a imagem cresce para caber
      H = Math.max(alturaTexto, Math.round(W * foto.alt / foto.larg));
    } else {
      H = Math.max(320, alturaTexto);
    }

    c.width = W; c.height = H;
    g = c.getContext("2d");
    g.fillStyle = tema.fundo; g.fillRect(0, 0, W, H);

    if (foto) {
      // preenche todo o quadro sem distorcer (recorta o excedente)
      var escala = Math.max(W / foto.larg, H / foto.alt);
      var lf = foto.larg * escala, af = foto.alt * escala;
      g.drawImage(foto.fonte, (W - lf) / 2, (H - af) / 2, lf, af);
      g.fillStyle = "rgba(0,0,0,.45)";                 // escurece para o texto branco ler bem
      g.fillRect(0, 0, W, H);
    }

    var topo = PAD;
    if (foto) {
      var pos = posicaoTexto();
      var bloco = lines.length * lineH;
      if (pos === "centro") topo = Math.max(PAD, Math.round((H - bloco) / 2));
      else if (pos === "rodape") topo = Math.max(PAD, H - PAD - bloco);
    }

    g.font = fontSize + "px " + FONT;
    g.textBaseline = "top";
    g.fillStyle = foto ? "#ffffff" : tema.texto;        // sobre foto, branco lê melhor
    if (foto) {                                        // contorno suave contra fundos claros
      g.shadowColor = "rgba(0,0,0,.85)";
      g.shadowBlur = 10;
    }
    for (var i = 0; i < lines.length; i++) {
      g.fillText(lines[i], PAD, topo + i * lineH + Math.round(fontSize * 0.12));
    }
    g.shadowBlur = 0;
    return c;
  }

  function render(text, fontSize) {
    var c = draw(text, fontSize);
    while (!foto && c.height > MAXH && fontSize > 22) {          // auto-ajuste p/ textos longos
      fontSize = Math.max(22, fontSize - 4);
      c = draw(text, fontSize);
    }
    return c;
  }

  /* ---------- PNG 8-bit em escala de cinza (bem mais leve) ---------- */
  var CRC = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(buf) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < buf.length; i++) c = CRC[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function chunk(type, data) {
    var out = new Uint8Array(12 + data.length);
    var dv = new DataView(out.buffer);
    dv.setUint32(0, data.length);
    for (var i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
    out.set(data, 8);
    dv.setUint32(8 + data.length, crc32(out.subarray(4, 8 + data.length)));
    return out;
  }

  function pngGray(w, h, gray) {
    // 4 bits por pixel (16 tons de cinza): metade dos bytes e muito menos entropia
    // que 8 bits -> arquivo bem menor, sem perda visual em texto branco no preto.
    var bpr = (w + 1) >> 1;                               // bytes por linha
    var raw = new Uint8Array((bpr + 1) * h);
    var prev = new Uint8Array(bpr), cur = new Uint8Array(bpr);
    for (var y = 0; y < h; y++) {
      var r = y * w, o = y * (bpr + 1);
      cur.fill(0);
      for (var x = 0; x < w; x++) {
        var v = gray[r + x] >> 4;                         // 0..15
        if (x & 1) cur[x >> 1] |= v; else cur[x >> 1] = v << 4;
      }
      raw[o] = 2;                                         // filtro "Up"
      for (var i = 0; i < bpr; i++) raw[o + 1 + i] = (cur[i] - prev[i]) & 0xFF;
      prev.set(cur);
    }
    var cs = new CompressionStream("deflate");            // zlib (RFC1950) = formato do IDAT
    var wr = cs.writable.getWriter(); wr.write(raw); wr.close();
    return new Response(cs.readable).arrayBuffer().then(function (ab) {
      var idat = new Uint8Array(ab);
      var ihdr = new Uint8Array(13), dv = new DataView(ihdr.buffer);
      dv.setUint32(0, w); dv.setUint32(4, h);
      ihdr[8] = 4;                                        // 4 bits por amostra
      ihdr[9] = 0;                                        // colorType 0 = grayscale
      var sig = new Uint8Array([137, 80, 78, 71, 13, 10, 26, 10]);
      var parts = [sig, chunk("IHDR", ihdr), chunk("IDAT", idat), chunk("IEND", new Uint8Array(0))];
      return new Blob(parts, { type: "image/png" });
    });
  }

  function toBlob(canvas) {
    var w = canvas.width, h = canvas.height;
    if (foto) {
      return new Promise(function (res) { canvas.toBlob(res, "image/jpeg", 0.85); });
    }
    if (typeof CompressionStream === "function") {
      try {
        var d = canvas.getContext("2d").getImageData(0, 0, w, h).data;
        var gray = new Uint8Array(w * h);
        var colorido = false;
        for (var i = 0, j = 0; j < gray.length; i += 4, j++) {
          if (d[i] !== d[i + 1] || d[i + 1] !== d[i + 2]) { colorido = true; break; }
          gray[j] = d[i];                                  // texto branco no preto: R=G=B
        }
        // emojis trazem cor: nesse caso vale o PNG colorido, mesmo pesando mais
        if (!colorido) return pngGray(w, h, gray);
      } catch (e) { /* cai no fallback */ }
    }
    return new Promise(function (res) { canvas.toBlob(res, "image/png"); });
  }

  /* ---------- ações ---------- */
  function fontSize() {
    return parseInt(document.querySelector('input[name="sz"]:checked').value, 10);
  }

  function fontsReady(px) {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    return document.fonts.load(px + 'px "JetBrains Mono"').catch(function () {});
  }

  function generate() {
    var text = msg.value.replace(/\s+$/, "");
    if (!text.trim()) { meta.textContent = "Digite uma mensagem primeiro."; msg.focus(); return; }

    btnGen.disabled = true;
    btnGen.textContent = "Gerando...";
    meta.textContent = "gerando...";
    var px = fontSize(), canvas;

    fontsReady(px).then(function () {
      canvas = render(text, px);
      return toBlob(canvas);
    }).then(function (blob) {
      if (current) URL.revokeObjectURL(current.url);
      var stamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, "");
      var ext = blob.type === "image/jpeg" ? ".jpg" : ".png";
      current = { blob: blob, url: URL.createObjectURL(blob), name: "msg-" + stamp + ext };

      out.src = current.url;
      preview.style.display = "block";
      meta.textContent = canvas.width + "×" + canvas.height + " px · " + Math.max(1, Math.round(blob.size / 1024)) + " KB";
      btnShare.disabled = btnSave.disabled = btnCopy.disabled = false;
      btnGen.disabled = false;
      btnGen.textContent = "Gerar imagem";
    }).catch(function (err) {
      meta.textContent = "Erro ao gerar" + (foto ? " com a foto" : "") + ": " + err;
      btnGen.disabled = false;
      btnGen.textContent = "Gerar imagem";
    });
  }

  /* ---------- temas ---------- */
  var caixaTemas = $("temas"), btTema = $("btTema");

  function aplicarTema(t) {
    tema = t;
    try { localStorage.setItem("tema", t.id); } catch (e) {}
    btTema.textContent = "Tema da imagem: " + t.nome;
    [].forEach.call(caixaTemas.children, function (b) {
      b.setAttribute("aria-pressed", b.dataset.id === t.id ? "true" : "false");
    });
    if (current) generate();
  }

  TEMAS.forEach(function (t) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "tema";
    b.dataset.id = t.id;
    b.setAttribute("aria-pressed", "false");
    var am = document.createElement("span");
    am.className = "amostra";
    am.style.background = t.fundo;
    am.style.color = t.texto;
    am.textContent = "Aa";
    b.appendChild(am);
    b.appendChild(document.createTextNode(t.nome));
    b.addEventListener("click", function () { aplicarTema(t); });
    caixaTemas.appendChild(b);
  });

  btTema.addEventListener("click", function () {
    var abrir = caixaTemas.hidden;
    caixaTemas.hidden = !abrir;
    btTema.setAttribute("aria-expanded", abrir ? "true" : "false");
  });

  (function () {                                        // retoma a escolha anterior
    var salvo;
    try { salvo = localStorage.getItem("tema"); } catch (e) {}
    var achado = TEMAS.filter(function (t) { return t.id === salvo; })[0];
    aplicarTema(achado || TEMAS[0]);
  })();

  /* ---------- foto de fundo ---------- */
  var arquivo = $("arquivo"), mini = $("mini"), faixaFoto = $("faixaFoto"), btnTirar = $("tirar");

  function posicaoTexto() {
    var sel = document.querySelector('input[name="pos"]:checked');
    return sel ? sel.value : "centro";
  }

  $("anexar").addEventListener("click", function () { arquivo.click(); });
  $("trocar").addEventListener("click", function () { arquivo.click(); });

  function usarFoto(fonte, larg, alt, url) {
    if (!larg || !alt) { meta.textContent = "Essa imagem veio sem tamanho — tente outra foto."; return; }
    if (foto && foto.url) URL.revokeObjectURL(foto.url);
    foto = { fonte: fonte, larg: larg, alt: alt, url: url };
    mini.src = url;
    faixaFoto.hidden = false;
    $("anexar").hidden = true;
    meta.textContent = "foto anexada — " + larg + "×" + alt + " px";
    if (msg.value.trim()) generate();
  }

  function porImagem(f, url) {                          // reserva: <img> comum
    var img = new Image();
    img.onload = function () { usarFoto(img, img.naturalWidth, img.naturalHeight, url); };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      meta.textContent = "Não consegui abrir essa foto. Se ela for HEIC, tente uma foto em JPG.";
    };
    img.src = url;
  }

  arquivo.addEventListener("change", function () {
    var f = arquivo.files && arquivo.files[0];
    arquivo.value = "";                                 // permite reanexar o mesmo arquivo
    if (!f) return;
    meta.textContent = "abrindo a foto...";
    var url = URL.createObjectURL(f);

    // createImageBitmap resolve orientação e formatos que o <img> às vezes recusa
    if (typeof createImageBitmap === "function") {
      var pedido;
      try { pedido = createImageBitmap(f, { imageOrientation: "from-image" }); }
      catch (e) { pedido = null; }
      if (!pedido || !pedido.then) { try { pedido = createImageBitmap(f); } catch (e2) { pedido = null; } }
      if (pedido && pedido.then) {
        pedido.then(function (bmp) { usarFoto(bmp, bmp.width, bmp.height, url); })
              .catch(function () { porImagem(f, url); });
        return;
      }
    }
    porImagem(f, url);
  });

  btnTirar.addEventListener("click", function () {
    if (foto && foto.url) URL.revokeObjectURL(foto.url);
    foto = null;
    mini.removeAttribute("src");
    faixaFoto.hidden = true;
    $("anexar").hidden = false;
    if (msg.value.trim()) generate(); else meta.textContent = "foto removida";
  });

  faixaFoto.addEventListener("change", function () { if (current) generate(); });

  /* ---------- emojis ---------- */
  function inserir(emoji) {
    var ini = msg.selectionStart, fim = msg.selectionEnd;
    if (typeof ini !== "number") { ini = fim = msg.value.length; }
    msg.value = msg.value.slice(0, ini) + emoji + msg.value.slice(fim);
    msg.selectionStart = msg.selectionEnd = ini + emoji.length;
    msg.focus();
    msg.dispatchEvent(new Event("input", { bubbles: true }));   // salva o rascunho
  }

  $("emojis").addEventListener("click", function (e) {
    var alvo = e.target.closest("button");
    if (!alvo || alvo.id === "mais") return;
    inserir(alvo.textContent);
  });

  var CATEGORIAS = [
    { nome: "Rostos", itens: "😀 😃 😄 😁 😆 😅 🤣 😂 🙂 🙃 😉 😊 😇 🥰 😍 🤩 😘 😗 😚 😙 😋 😛 😜 🤪 😝 🤗 🤭 🤫 🤔 🤐 😐 😑 😶 😏 😒 🙄 😬 😮 😯 😲 🥱 😴 🤤 😪 😵 🤯 🤠 🥳 😎 🤓 🧐 😕 😟 🙁 😮‍💨 😢 😭 😤 😠 😡 🤬 😳 🥺 😨 😰 😥 😓 🤥 🤒 🤕 🤧 😷 🤢 🤮 🥵 🥶 😈 💀 👻 🤖" },
    { nome: "Gestos", itens: "👍 👎 👌 🤌 ✌️ 🤞 🤟 🤘 🤙 👈 👉 👆 👇 ☝️ ✋ 🤚 🖐️ 🖖 👋 🤝 🙏 ✍️ 💪 🦾 👏 🙌 👐 🤲 🫶 💅 👀 👁️ 👣 🧠 🫀 🗣️ 👤 👥 🧑 👩 👨 👵 👴 👶 🧒 👮 🕵️ 💂 👷 🧑‍🔧 🧑‍🍳 🧑‍⚕️ 🧑‍🏫 🧑‍💻 🤵 👰 🎅 🦸 🦹 🧙" },
    { nome: "Símbolos", itens: "❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 ❣️ 💕 💞 💓 💗 💖 💘 💝 ✅ ☑️ ✔️ ❌ ❎ ⭕ 🚫 ⛔ ❗ ❕ ❓ ❔ ⚠️ 🔥 ⭐ 🌟 ✨ ⚡ 💥 💯 🔔 🔕 🔒 🔓 🔑 ⏰ ⏳ ⌛ 🕐 📅 📆 🗓️ ♻️ 🆗 🆕 🆙 🔝 🔜 ➡️ ⬅️ ⬆️ ⬇️ 🔄 ▶️ ⏸️ ⏹️ ➕ ➖ ✖️ ➗ 🟢 🟡 🔴 🔵 ⚫ ⚪" },
    { nome: "Trabalho", itens: "💰 💵 💴 💶 💷 💸 💳 🧾 🪙 📈 📉 📊 📋 📌 📍 📎 🖇️ 📏 📐 ✂️ 🗂️ 📁 📂 🗃️ 🗄️ 📝 ✏️ 🖊️ 🖋️ 🖌️ 📖 📚 📓 📔 📒 📕 📗 📘 📙 🔖 📰 🗞️ 💼 🏢 🏭 🏦 🏪 🏬 🔧 🔨 🛠️ ⚙️ 🔩 🧰 🪛 🪚 🧲 🔌 🔋 💡 🕯️ 🧪 🔬 🔭 📡 🖥️ 💻 ⌨️ 🖱️ 🖨️ 📱 ☎️ 📞 📲 📟 📠 📧 📨 📩 📤 📥 📦 🚚 ✉️" },
    { nome: "Comida", itens: "☕ 🍵 🧉 🥤 🧃 🍺 🍻 🥂 🍷 🥃 🍸 🍾 🧊 🍽️ 🍴 🥄 🍞 🥐 🥖 🥯 🥞 🧇 🧀 🥚 🍳 🥓 🥩 🍗 🍖 🌭 🍔 🍟 🍕 🥪 🌮 🌯 🥗 🥘 🍝 🍜 🍲 🍛 🍣 🍱 🥟 🍤 🍚 🍙 🥠 🍦 🍰 🎂 🧁 🥧 🍫 🍬 🍭 🍩 🍪 🌰 🥜 🍎 🍏 🍐 🍊 🍋 🍌 🍉 🍇 🍓 🫐 🍒 🍑 🥭 🍍 🥥 🥝 🍅 🥑 🥦 🥕 🌽 🌶️ 🥔" },
    { nome: "Lugares", itens: "🏠 🏡 🏘️ 🏚️ 🏗️ 🏛️ ⛪ 🕌 🛕 🕍 ⛩️ 🏰 🏯 🏟️ 🎡 🎢 🎠 ⛲ ⛱️ 🏖️ 🏝️ 🏜️ 🌋 ⛰️ 🏔️ 🗻 🏕️ ⛺ 🛤️ 🛣️ 🌁 🌉 🗼 🗽 🎇 🎆 🌃 🌆 🌇 🌅 🌄 🌠 🚗 🚕 🚙 🚌 🚑 🚒 🚓 🏍️ 🛵 🚲 🛴 ✈️ 🚀 🛸 🚁 ⛵ 🚢 ⛽ 🚦 🚧 🗺️ 🧭" },
    { nome: "Natureza", itens: "🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🙈 🙉 🙊 🐔 🐧 🐦 🐤 🦆 🦅 🦉 🦇 🐺 🐗 🐴 🦄 🐝 🐛 🦋 🐌 🐞 🐜 🕷️ 🦂 🐢 🐍 🦎 🐙 🦑 🦐 🦞 🦀 🐠 🐟 🐬 🐳 🐋 🦈 🐊 🐘 🦒 🦓 🐄 🐓 🕊️ 🌵 🎄 🌲 🌳 🌴 🌱 🌿 ☘️ 🍀 🎍 🍃 🍂 🍁 🌾 💐 🌷 🌹 🌺 🌸 🌼 🌻 ☀️ 🌤️ ⛅ ☁️ 🌧️ ⛈️ 🌩️ ❄️ ⛄ 🌊 💧 🌙 🌎 🌍" },
    { nome: "Festa", itens: "🎉 🎊 🎈 🎁 🎀 🪅 🎂 🍰 🥳 🎵 🎶 🎤 🎧 🎼 🎹 🥁 🎸 🎺 🎷 🪗 🎻 🎬 🎭 🎨 🎯 🎳 🎮 🕹️ 🎲 ♟️ 🧩 🏆 🥇 🥈 🥉 🏅 ⚽ 🏀 🏈 ⚾ 🎾 🏐 🏉 🎱 🏓 🏸 🥊 🛹 🏂 ⛷️ 🏄 🚴 🏋️ 🤸 🧘 ⛳ 🎣 🎿 🪁 🧨 🕶️ 👗 👕 👖 🧥 👞 👟 🎩 🧢 💍 👜 🎒 ⌚" }
  ];

  var abas = $("abas"), grade = $("grade"), painel = $("painel"), btnMais = $("mais");

  function mostrarCategoria(indice) {
    [].forEach.call(abas.children, function (aba, i) {
      aba.setAttribute("aria-selected", i === indice ? "true" : "false");
    });
    grade.innerHTML = "";
    CATEGORIAS[indice].itens.split(" ").forEach(function (emoji) {
      if (!emoji) return;
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = emoji;
      grade.appendChild(b);
    });
    grade.scrollTop = 0;
  }

  CATEGORIAS.forEach(function (cat, i) {
    var aba = document.createElement("button");
    aba.type = "button";
    aba.textContent = cat.nome;
    aba.setAttribute("role", "tab");
    aba.setAttribute("aria-selected", i === 0 ? "true" : "false");
    aba.addEventListener("click", function () { mostrarCategoria(i); });
    abas.appendChild(aba);
  });

  grade.addEventListener("click", function (e) {
    var alvo = e.target.closest("button");
    if (alvo) inserir(alvo.textContent);
  });

  btnMais.addEventListener("click", function () {
    var aberto = painel.hidden;
    painel.hidden = !aberto;
    btnMais.setAttribute("aria-expanded", aberto ? "true" : "false");
    btnMais.textContent = aberto ? "fechar" : "mais";
    if (aberto && !grade.children.length) mostrarCategoria(0);
  });

  btnGen.addEventListener("click", generate);

  // Ctrl/Cmd + Enter também gera
  msg.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); generate(); }
  });

  // regerar ao trocar o tamanho, se já houver imagem
  $("size").addEventListener("change", function () { if (current) generate(); });

  btnShare.addEventListener("click", function () {
    if (!current) return;
    var file = new File([current.blob], current.name, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).catch(function () {});
    } else {
      meta.textContent = "Compartilhamento indisponível aqui — use Baixar ou Copiar.";
    }
  });

  btnSave.addEventListener("click", function () {
    if (!current) return;
    var a = document.createElement("a");
    a.href = current.url; a.download = current.name;
    document.body.appendChild(a); a.click(); a.remove();
  });

  /* app instalável e offline quando servido por http(s) — em file:// é ignorado */
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }

  btnCopy.addEventListener("click", function () {
    if (!current || !navigator.clipboard || typeof ClipboardItem === "undefined") {
      meta.textContent = "Copiar indisponível neste navegador."; return;
    }
    navigator.clipboard.write([new ClipboardItem({ "image/png": current.blob })])
      .then(function () { meta.textContent = "Imagem copiada — cole no WhatsApp Web."; })
      .catch(function () { meta.textContent = "Não foi possível copiar."; });
  });
})();
