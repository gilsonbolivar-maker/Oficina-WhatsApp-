<style>
  :root{
    --bg:#000; --fg:#fff; --dim:#8a8a8a; --line:#242424; --accent:#25d366;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
  body{font-family:var(--mono);font-size:15px;line-height:1.45;
       padding:16px 16px calc(16px + env(safe-area-inset-bottom));
       max-width:760px;margin:0 auto;-webkit-text-size-adjust:100%}
  .rotulo{
    color:#FFD700;font-size:11px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;
    margin:0 0 5px 3px;
  }
  textarea{
    width:100%;min-height:170px;resize:vertical;
    background:#0a0a0a;color:var(--fg);border:2px solid #4d4d4d;border-radius:12px;
    padding:13px;font-family:var(--mono);font-size:15px;line-height:1.5;caret-color:var(--accent);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  textarea:hover{border-color:#6b6b6b}
  textarea:focus{
    outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(37,211,102,.18);
  }

  .linha-emojis{display:flex;gap:6px;align-items:center;margin-top:8px}
  .emojis{
    display:flex;gap:6px;flex:1 1 auto;min-width:0;
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .emojis::-webkit-scrollbar{display:none}
  .emojis button{
    flex:0 0 auto;min-width:0;
    padding:5px 8px;font-size:19px;line-height:1.1;font-weight:400;
    background:#111;border:1px solid var(--line);border-radius:9px;
  }
  .emojis button:hover{border-color:#3d3d3d}
  .mais{
    flex:0 0 auto;min-width:0;padding:6px 12px;
    font-size:12px;font-weight:700;color:var(--dim);
    background:#111;border:1px solid var(--line);border-radius:9px;
  }
  .mais[aria-expanded="true"]{color:#FFD700;border-color:#FFD70055}

  .painel{
    margin-top:8px;border:1px solid var(--line);border-radius:12px;
    background:#0a0a0a;overflow:hidden;
  }
  .abas{
    display:flex;gap:4px;padding:8px;overflow-x:auto;
    border-bottom:1px solid var(--line);scrollbar-width:none;
  }
  .abas::-webkit-scrollbar{display:none}
  .abas button{
    flex:0 0 auto;min-width:0;padding:6px 11px;border-radius:8px;
    font-size:12px;font-weight:400;color:var(--dim);background:transparent;border:1px solid transparent;
  }
  .abas button[aria-selected="true"]{color:#000;background:#FFD700;font-weight:700}
  .grade{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));
    gap:4px;padding:8px;max-height:210px;overflow-y:auto;
  }
  .grade button{
    flex:none;min-width:0;padding:6px 0;font-size:21px;line-height:1.1;font-weight:400;
    background:transparent;border:1px solid transparent;border-radius:8px;
  }
  .grade button:hover{background:#161616;border-color:var(--line)}

  .foto-barra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .foto-bt{flex:0 0 auto;min-width:0;padding:9px 14px;font-size:13px}
  #tirar{margin-left:0}
  .foto-barra .mini{
    width:44px;height:44px;object-fit:cover;border-radius:8px;
    border:1px solid var(--line);display:block;
  }
  .pos{display:flex;flex:0 0 auto;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .pos label{position:relative;cursor:pointer}
  .pos input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
  .pos span{display:block;padding:7px 12px;font-size:12px;color:var(--dim)}
  .pos input:checked ~ span{background:var(--fg);color:#000;font-weight:700}

  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  button{
    font-family:var(--mono);font-size:14px;font-weight:700;
    background:#111;color:var(--fg);border:1px solid var(--line);border-radius:10px;
    padding:11px 14px;cursor:pointer;flex:1 1 auto;min-width:120px;
  }
  button:hover:not(:disabled){border-color:#3d3d3d}
  button:disabled{opacity:.4;cursor:default}
  button.primary{
    background:var(--accent);color:#000;border-color:var(--accent);
    flex:0 0 auto;min-width:0;padding:9px 20px;font-size:13px;border-radius:9px;
  }

  fieldset{border:0;padding:0;margin:12px 0 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  legend{float:left;color:var(--dim);font-size:12px;margin-right:8px;padding:0}
  .seg{display:flex;flex:0 0 auto;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg label{padding:7px 12px;font-size:13px;color:var(--dim);cursor:pointer}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg input:checked + span{background:var(--fg);color:#000}
  .seg label span{display:block;margin:-7px -12px;padding:7px 12px}

  .wipe{
    margin-left:auto;flex:0 0 auto;min-width:0;
    background:none;border:0;padding:6px 4px;
    font-family:var(--mono);font-size:12px;font-weight:400;color:var(--dim);cursor:pointer;
  }
  .wipe:hover{color:#ff7a6b}
  .wipe[data-armed="1"]{color:#ff7a6b;font-weight:700}

  #preview{margin-top:16px;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:none}
  #preview img{display:block;width:100%;height:auto}
  .meta{color:var(--dim);font-size:12px;margin-top:8px;min-height:16px}
  .hint{color:var(--dim);font-size:12px;margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  .hint b{color:var(--fg)}
</style>
</head>

<script>
(function () {
  "use strict";

  var W = 1080;              // largura final da imagem (px)
  var PAD = 64;              // margem interna
  var LH = 1.5;              // altura de linha
  var MAXH = 4200;           // altura máxima antes de reduzir a fonte
  var FONT = '"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace';

  var $ = function (id) { return document.getElementById(id); };
  var msg = $("msg"), out = $("out"), preview = $("preview"), meta = $("meta");
  var btnGen = $("gen"), btnShare = $("share"), btnSave = $("save"), btnCopy = $("copy");
  var btnWipe = $("wipe");

  var current = null;
  var foto = null;          // <img> da foto anexada, quando houver   // { blob, url, name }

  /* ---------- rascunho ---------- */
  try { msg.value = localStorage.getItem("draft") || ""; } catch (e) {}
  msg.addEventListener("input", function () {
    disarm();
    try { localStorage.setItem("draft", msg.value); } catch (e) {}
  });

  /* ---------- apagar tudo (texto salvo + imagem gerada) ---------- */
  var armed = false, armTimer;
  function disarm() {
    armed = false;
    clearTimeout(armTimer);
    btnWipe.textContent = "apagar tudo";
    btnWipe.removeAttribute("data-armed");
  }
  function wipe() {
    disarm();
    msg.value = "";
    try { localStorage.removeItem("draft"); } catch (e) {}
    if (current) { URL.revokeObjectURL(current.url); current = null; }
    if (foto) btnTirar.click();
    out.removeAttribute("src");
    preview.style.display = "none";
    btnShare.disabled = btnSave.disabled = btnCopy.disabled = true;
    meta.textContent = "apagado — nada guardado neste aparelho";
    msg.focus();
  }
  btnWipe.addEventListener("click", function () {
    if (!msg.value && !current) { wipe(); return; }
    if (!armed) {
      armed = true;
      btnWipe.textContent = "apagar mesmo?";
      btnWipe.setAttribute("data-armed", "1");
      armTimer = setTimeout(disarm, 4000);
      return;
    }
    wipe();
  });

  /* ---------- quebra de linha (monoespaçada) ---------- */
  function wrap(text, maxChars) {
    var lines = [];
    text.replace(/\r/g, "").split("\n").forEach(function (para) {
      if (!para.length) { lines.push(""); return; }
      var line = "";
      para.split(/(\s+)/).forEach(function (tk) {
        if (!tk.length) return;
        if (/^\s+$/.test(tk)) {                    // espaços
          if (line.length && line.length + tk.length <= maxChars) line += tk;
          else if (line.length) { lines.push(line); line = ""; }
          return;
        }
        while (tk.length) {                        // palavras
          var free = maxChars - line.length;
          if (tk.length <= free) { line += tk; tk = ""; }
          else if (tk.length <= maxChars) { lines.push(line.replace(/\s+$/, "")); line = ""; }
          else { line += tk.slice(0, free); tk = tk.slice(free); lines.push(line); line = ""; }
        }
      });
      lines.push(line.replace(/\s+$/, ""));
    });
    return lines;
  }

  /* ---------- desenho ---------- */
  function draw(text, fontSize) {
    var c = document.createElement("canvas");
    var g = c.getContext("2d");
    g.font = fontSize + "px " + FONT;
    var charW = g.measureText("M").width || fontSize * 0.6;
    var maxChars = Math.max(8, Math.floor((W - PAD * 2) / charW));

    var lines = wrap(text, maxChars);
    var lineH = Math.round(fontSize * LH);
    var alturaTexto = PAD * 2 + lines.length * lineH;
    var H;

    if (foto) {
      // a foto define a altura; se o texto for maior, a imagem cresce para caber
      H = Math.max(alturaTexto, Math.round(W * foto.naturalHeight / foto.naturalWidth));
    } else {
      H = Math.max(320, alturaTexto);
    }

    c.width = W; c.height = H;
    g = c.getContext("2d");
    g.fillStyle = "#000"; g.fillRect(0, 0, W, H);

    if (foto) {
      // preenche todo o quadro sem distorcer (recorta o excedente)
      var escala = Math.max(W / foto.naturalWidth, H / foto.naturalHeight);
      var lf = foto.naturalWidth * escala, af = foto.naturalHeight * escala;
      g.drawImage(foto, (W - lf) / 2, (H - af) / 2, lf, af);
      g.fillStyle = "rgba(0,0,0,.45)";                 // escurece para o texto branco ler bem
      g.fillRect(0, 0, W, H);
    }

    var topo = PAD;
    if (foto) {
      var pos = posicaoTexto();
      var bloco = lines.length * lineH;
      if (pos === "centro") topo = Math.max(PAD, Math.round((H - bloco) / 2));
      else if (pos === "rodape") topo = Math.max(PAD, H - PAD - bloco);
    }

    g.font = fontSize + "px " + FONT;
    g.textBaseline = "top";
    g.fillStyle = "#fff";
    if (foto) {                                        // contorno suave contra fundos claros
      g.shadowColor = "rgba(0,0,0,.85)";
      g.shadowBlur = 10;
    }
    for (var i = 0; i < lines.length; i++) {
      g.fillText(lines[i], PAD, topo + i * lineH + Math.round(fontSize * 0.12));
    }
    g.shadowBlur = 0;
    return c;
  }

  function render(text, fontSize) {
    var c = draw(text, fontSize);
    while (!foto && c.height > MAXH && fontSize > 22) {          // auto-ajuste p/ textos longos
      fontSize = Math.max(22, fontSize - 4);
      c = draw(text, fontSize);
    }
    return c;
  }

  /* ---------- PNG 8-bit em escala de cinza (bem mais leve) ---------- */
  var CRC = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(buf) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < buf.length; i++) c = CRC[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function chunk(type, data) {
    var out = new Uint8Array(12 + data.length);
    var dv = new DataView(out.buffer);
    dv.setUint32(0, data.length);
    for (var i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
    out.set(data, 8);
    dv.setUint32(8 + data.length, crc32(out.subarray(4, 8 + data.length)));
    return out;
  }

  function pngGray(w, h, gray) {
    // 4 bits por pixel (16 tons de cinza): metade dos bytes e muito menos entropia
    // que 8 bits -> arquivo bem menor, sem perda visual em texto branco no preto.
    var bpr = (w + 1) >> 1;                               // bytes por linha
    var raw = new Uint8Array((bpr + 1) * h);
    var prev = new Uint8Array(bpr), cur = new Uint8Array(bpr);
    for (var y = 0; y < h; y++) {
      var r = y * w, o = y * (bpr + 1);
      cur.fill(0);
      for (var x = 0; x < w; x++) {
        var v = gray[r + x] >> 4;                         // 0..15
        if (x & 1) cur[x >> 1] |= v; else cur[x >> 1] = v << 4;
      }
      raw[o] = 2;                                         // filtro "Up"
      for (var i = 0; i < bpr; i++) raw[o + 1 + i] = (cur[i] - prev[i]) & 0xFF;
      prev.set(cur);
    }
    var cs = new CompressionStream("deflate");            // zlib (RFC1950) = formato do IDAT
    var wr = cs.writable.getWriter(); wr.write(raw); wr.close();
    return new Response(cs.readable).arrayBuffer().then(function (ab) {
      var idat = new Uint8Array(ab);
      var ihdr = new Uint8Array(13), dv = new DataView(ihdr.buffer);
      dv.setUint32(0, w); dv.setUint32(4, h);
      ihdr[8] = 4;                                        // 4 bits por amostra
      ihdr[9] = 0;                                        // colorType 0 = grayscale
      var sig = new Uint8Array([137, 80, 78, 71, 13, 10, 26, 10]);
      var parts = [sig, chunk("IHDR", ihdr), chunk("IDAT", idat), chunk("IEND", new Uint8Array(0))];
      return new Blob(parts, { type: "image/png" });
    });
  }

  function toBlob(canvas) {
    var w = canvas.width, h = canvas.height;
    if (foto) {
      return new Promise(function (res) { canvas.toBlob(res, "image/jpeg", 0.85); });
    }
    if (typeof CompressionStream === "function") {
      try {
        var d = canvas.getContext("2d").getImageData(0, 0, w, h).data;
        var gray = new Uint8Array(w * h);
        var colorido = false;
        for (var i = 0, j = 0; j < gray.length; i += 4, j++) {
          if (d[i] !== d[i + 1] || d[i + 1] !== d[i + 2]) { colorido = true; break; }
          gray[j] = d[i];                                  // texto branco no preto: R=G=B
        }
        // emojis trazem cor: nesse caso vale o PNG colorido, mesmo pesando mais
        if (!colorido) return pngGray(w, h, gray);
      } catch (e) { /* cai no fallback */ }
    }
    return new Promise(function (res) { canvas.toBlob(res, "image/png"); });
  }

  /* ---------- ações ---------- */
  function fontSize() {
    return parseInt(document.querySelector('input[name="sz"]:checked').value, 10);
  }

  function fontsReady(px) {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    return document.fonts.load(px + 'px "JetBrains Mono"').catch(function () {});
  }

  function generate() {
    var text = msg.value.replace(/\s+$/, "");
    if (!text.trim()) { meta.textContent = "Digite uma mensagem primeiro."; msg.focus(); return; }

    btnGen.disabled = true;
    meta.textContent = "gerando...";
    var px = fontSize(), canvas;

    fontsReady(px).then(function () {
      canvas = render(text, px);
      return toBlob(canvas);
    }).then(function (blob) {
      if (current) URL.revokeObjectURL(current.url);
      var stamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, "");
      var ext = blob.type === "image/jpeg" ? ".jpg" : ".png";
      current = { blob: blob, url: URL.createObjectURL(blob), name: "msg-" + stamp + ext };

      out.src = current.url;
      preview.style.display = "block";
      meta.textContent = canvas.width + "×" + canvas.height + " px · " + Math.max(1, Math.round(blob.size / 1024)) + " KB";
      btnShare.disabled = btnSave.disabled = btnCopy.disabled = false;
      btnGen.disabled = false;
    }).catch(function (err) {
      meta.textContent = "Erro ao gerar: " + err;
      btnGen.disabled = false;
    });
  }

  /* ---------- foto de fundo ---------- */
  var arquivo = $("arquivo"), mini = $("mini"), caixaPos = $("posicao"), btnTirar = $("tirar");

  function posicaoTexto() {
    var sel = document.querySelector('input[name="pos"]:checked');
    return sel ? sel.value : "centro";
  }

  $("anexar").addEventListener("click", function () { arquivo.click(); });

  arquivo.addEventListener("change", function () {
    var f = arquivo.files && arquivo.files[0];
    if (!f) return;
    var url = URL.createObjectURL(f);
    var img = new Image();
    img.onload = function () {
      if (foto && foto.src.indexOf("blob:") === 0) URL.revokeObjectURL(foto.src);
      foto = img;
      mini.src = url; mini.hidden = false;
      caixaPos.hidden = false; btnTirar.hidden = false;
      $("anexar").textContent = "Trocar foto";
      meta.textContent = "foto anexada — " + img.naturalWidth + "×" + img.naturalHeight + " px";
      if (msg.value.trim()) generate();
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      meta.textContent = "Não foi possível ler essa imagem.";
    };
    img.src = url;
    arquivo.value = "";                                 // permite reanexar o mesmo arquivo
  });

  btnTirar.addEventListener("click", function () {
    if (foto && foto.src.indexOf("blob:") === 0) URL.revokeObjectURL(foto.src);
    foto = null;
    mini.hidden = true; mini.removeAttribute("src");
    caixaPos.hidden = true; btnTirar.hidden = true;
    $("anexar").textContent = "Anexar foto";
    if (msg.value.trim()) generate(); else meta.textContent = "foto removida";
  });

  caixaPos.addEventListener("change", function () { if (current) generate(); });

  /* ---------- emojis ---------- */
  function inserir(emoji) {
    var ini = msg.selectionStart, fim = msg.selectionEnd;
    if (typeof ini !== "number") { ini = fim = msg.value.length; }
    msg.value = msg.value.slice(0, ini) + emoji + msg.value.slice(fim);
    msg.selectionStart = msg.selectionEnd = ini + emoji.length;
    msg.focus();
    msg.dispatchEvent(new Event("input", { bubbles: true }));   // salva o rascunho
  }

  $("emojis").addEventListener("click", function (e) {
    var alvo = e.target.closest("button");
    if (!alvo || alvo.id === "mais") return;
    inserir(alvo.textContent);
  });

  var CATEGORIAS = [
    { nome: "Rostos", itens: "😀 😃 😄 😁 😆 😅 🤣 😂 🙂 🙃 😉 😊 😇 🥰 😍 🤩 😘 😗 😚 😙 😋 😛 😜 🤪 😝 🤗 🤭 🤫 🤔 🤐 😐 😑 😶 😏 😒 🙄 😬 😮 😯 😲 🥱 😴 🤤 😪 😵 🤯 🤠 🥳 😎 🤓 🧐 😕 😟 🙁 😮‍💨 😢 😭 😤 😠 😡 🤬 😳 🥺 😨 😰 😥 😓 🤥 🤒 🤕 🤧 😷 🤢 🤮 🥵 🥶 😈 💀 👻 🤖" },
    { nome: "Gestos", itens: "👍 👎 👌 🤌 ✌️ 🤞 🤟 🤘 🤙 👈 👉 👆 👇 ☝️ ✋ 🤚 🖐️ 🖖 👋 🤝 🙏 ✍️ 💪 🦾 👏 🙌 👐 🤲 🫶 💅 👀 👁️ 👣 🧠 🫀 🗣️ 👤 👥 🧑 👩 👨 👵 👴 👶 🧒 👮 🕵️ 💂 👷 🧑‍🔧 🧑‍🍳 🧑‍⚕️ 🧑‍🏫 🧑‍💻 🤵 👰 🎅 🦸 🦹 🧙" },
    { nome: "Símbolos", itens: "❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 ❣️ 💕 💞 💓 💗 💖 💘 💝 ✅ ☑️ ✔️ ❌ ❎ ⭕ 🚫 ⛔ ❗ ❕ ❓ ❔ ⚠️ 🔥 ⭐ 🌟 ✨ ⚡ 💥 💯 🔔 🔕 🔒 🔓 🔑 ⏰ ⏳ ⌛ 🕐 📅 📆 🗓️ ♻️ 🆗 🆕 🆙 🔝 🔜 ➡️ ⬅️ ⬆️ ⬇️ 🔄 ▶️ ⏸️ ⏹️ ➕ ➖ ✖️ ➗ 🟢 🟡 🔴 🔵 ⚫ ⚪" },
    { nome: "Trabalho", itens: "💰 💵 💴 💶 💷 💸 💳 🧾 🪙 📈 📉 📊 📋 📌 📍 📎 🖇️ 📏 📐 ✂️ 🗂️ 📁 📂 🗃️ 🗄️ 📝 ✏️ 🖊️ 🖋️ 🖌️ 📖 📚 📓 📔 📒 📕 📗 📘 📙 🔖 📰 🗞️ 💼 🏢 🏭 🏦 🏪 🏬 🔧 🔨 🛠️ ⚙️ 🔩 🧰 🪛 🪚 🧲 🔌 🔋 💡 🕯️ 🧪 🔬 🔭 📡 🖥️ 💻 ⌨️ 🖱️ 🖨️ 📱 ☎️ 📞 📲 📟 📠 📧 📨 📩 📤 📥 📦 🚚 ✉️" },
    { nome: "Comida", itens: "☕ 🍵 🧉 🥤 🧃 🍺 🍻 🥂 🍷 🥃 🍸 🍾 🧊 🍽️ 🍴 🥄 🍞 🥐 🥖 🥯 🥞 🧇 🧀 🥚 🍳 🥓 🥩 🍗 🍖 🌭 🍔 🍟 🍕 🥪 🌮 🌯 🥗 🥘 🍝 🍜 🍲 🍛 🍣 🍱 🥟 🍤 🍚 🍙 🥠 🍦 🍰 🎂 🧁 🥧 🍫 🍬 🍭 🍩 🍪 🌰 🥜 🍎 🍏 🍐 🍊 🍋 🍌 🍉 🍇 🍓 🫐 🍒 🍑 🥭 🍍 🥥 🥝 🍅 🥑 🥦 🥕 🌽 🌶️ 🥔" },
    { nome: "Lugares", itens: "🏠 🏡 🏘️ 🏚️ 🏗️ 🏛️ ⛪ 🕌 🛕 🕍 ⛩️ 🏰 🏯 🏟️ 🎡 🎢 🎠 ⛲ ⛱️ 🏖️ 🏝️ 🏜️ 🌋 ⛰️ 🏔️ 🗻 🏕️ ⛺ 🛤️ 🛣️ 🌁 🌉 🗼 🗽 🎇 🎆 🌃 🌆 🌇 🌅 🌄 🌠 🚗 🚕 🚙 🚌 🚑 🚒 🚓 🏍️ 🛵 🚲 🛴 ✈️ 🚀 🛸 🚁 ⛵ 🚢 ⛽ 🚦 🚧 🗺️ 🧭" },
    { nome: "Natureza", itens: "🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🙈 🙉 🙊 🐔 🐧 🐦 🐤 🦆 🦅 🦉 🦇 🐺 🐗 🐴 🦄 🐝 🐛 🦋 🐌 🐞 🐜 🕷️ 🦂 🐢 🐍 🦎 🐙 🦑 🦐 🦞 🦀 🐠 🐟 🐬 🐳 🐋 🦈 🐊 🐘 🦒 🦓 🐄 🐓 🕊️ 🌵 🎄 🌲 🌳 🌴 🌱 🌿 ☘️ 🍀 🎍 🍃 🍂 🍁 🌾 💐 🌷 🌹 🌺 🌸 🌼 🌻 ☀️ 🌤️ ⛅ ☁️ 🌧️ ⛈️ 🌩️ ❄️ ⛄ 🌊 💧 🌙 🌎 🌍" },
    { nome: "Festa", itens: "🎉 🎊 🎈 🎁 🎀 🪅 🎂 🍰 🥳 🎵 🎶 🎤 🎧 🎼 🎹 🥁 🎸 🎺 🎷 🪗 🎻 🎬 🎭 🎨 🎯 🎳 🎮 🕹️ 🎲 ♟️ 🧩 🏆 🥇 🥈 🥉 🏅 ⚽ 🏀 🏈 ⚾ 🎾 🏐 🏉 🎱 🏓 🏸 🥊 🛹 🏂 ⛷️ 🏄 🚴 🏋️ 🤸 🧘 ⛳ 🎣 🎿 🪁 🧨 🕶️ 👗 👕 👖 🧥 👞 👟 🎩 🧢 💍 👜 🎒 ⌚" }
  ];

  var abas = $("abas"), grade = $("grade"), painel = $("painel"), btnMais = $("mais");

  function mostrarCategoria(indice) {
    [].forEach.call(abas.children, function (aba, i) {
      aba.setAttribute("aria-selected", i === indice ? "true" : "false");
    });
    grade.innerHTML = "";
    CATEGORIAS[indice].itens.split(" ").forEach(function (emoji) {
      if (!emoji) return;
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = emoji;
      grade.appendChild(b);
    });
    grade.scrollTop = 0;
  }

  CATEGORIAS.forEach(function (cat, i) {
    var aba = document.createElement("button");
    aba.type = "button";
    aba.textContent = cat.nome;
    aba.setAttribute("role", "tab");
    aba.setAttribute("aria-selected", i === 0 ? "true" : "false");
    aba.addEventListener("click", function () { mostrarCategoria(i); });
    abas.appendChild(aba);
  });

  grade.addEventListener("click", function (e) {
    var alvo = e.target.closest("button");
    if (alvo) inserir(alvo.textContent);
  });

  btnMais.addEventListener("click", function () {
    var aberto = painel.hidden;
    painel.hidden = !aberto;
    btnMais.setAttribute("aria-expanded", aberto ? "true" : "false");
    btnMais.textContent = aberto ? "fechar" : "mais";
    if (aberto && !grade.children.length) mostrarCategoria(0);
  });

  btnGen.addEventListener("click", generate);

  // Ctrl/Cmd + Enter também gera
  msg.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); generate(); }
  });

  // regerar ao trocar o tamanho, se já houver imagem
  $("size").addEventListener("change", function () { if (current) generate(); });

  btnShare.addEventListener("click", function () {
    if (!current) return;
    var file = new File([current.blob], current.name, { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).catch(function () {});
    } else {
      meta.textContent = "Compartilhamento indisponível aqui — use Baixar ou Copiar.";
    }
  });

  btnSave.addEventListener("click", function () {
    if (!current) return;
    var a = document.createElement("a");
    a.href = current.url; a.download = current.name;
    document.body.appendChild(a); a.click(); a.remove();
  });

  /* app instalável e offline quando servido por http(s) — em file:// é ignorado */
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }

  btnCopy.addEventListener("click", function () {
    if (!current || !navigator.clipboard || typeof ClipboardItem === "undefined") {
      meta.textContent = "Copiar indisponível neste navegador."; return;
    }
    navigator.clipboard.write([new ClipboardItem({ "image/png": current.blob })])
      .then(function () { meta.textContent = "Imagem copiada — cole no WhatsApp Web."; })
      .catch(function () { meta.textContent = "Não foi possível copiar."; });
  });
})();
</script>
